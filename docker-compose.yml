version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

  app:
    build: .
    container_name: express-app
    depends_on:
      - nginx
    environment:
      - PORT=5000